apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapp.operator
spec:
  group: operator
  names:
    kind: WebApp
    plural: webapps
    singular: webapp
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion: 
            type: string
          kind:
            type: string
          spec:
            type: object
            properties:
              image:
                type: string
              ports:
                type: array
                items:
                  type: object
                  properties:
                    internal: 
                      type: integer
                      format: int64
                    external: 
                      type: integer
                      format: int64
                    
                  